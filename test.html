<!DOCTYPE html>
<html>
    <head>
        <style>
            #mascot {
                position: absolute;
                overflow: hidden;
            }
            .flipped {
                transform: scaleX(-1);
                -webkit-transform: scaleX(-1);
            }
        </style>
    </head>
    <body>
        <pre id="output"></pre>
        <img id="mascot">
        <script src="build/Shijima-Web.js"></script>
        <script>
            async function initShijima() {
                try {
                    const actions = await (await fetch("libshimejifinder/default_actions.xml")).text();
                    const behaviors = await (await fetch("libshimejifinder/default_behaviors.xml")).text();
                    globalThis.Shijima = await createShijima();
                    const ctx = new Shijima.ScriptContext();
                    document.getElementById("output").innerText = ctx.eval('(function(){return{"Hello":"world","1+1":1+1}})()') + "\n";
                    const env = new Shijima.MascotEnvironment();
                    env.setSubticks(2);
                    const factory = new Shijima.MascotFactory(ctx, env);
                    factory.registerTemplate("default", "/", actions, behaviors);
                    let manager = factory.spawnAdam("default", 100, 100, "Fall", false);

                    const images = {};
                    const img = document.getElementById("mascot");
                    let draggedManager = null;
                    let mouseX = 0, mouseY = 0;
                    img.onmousedown = () => {
                        draggedManager = manager;
                        manager.setDragging(true);
                        return false;
                    };
                    img.onmouseup = () => {
                        draggedManager?.setDragging(false);
                        draggedManager = null;
                        return false;
                    };
                    const drawImage = (image) => {
                        const drawInfo = manager.getDrawInfo(image.width, image.height);
                        img.src = image.src;
                        img.style.left = `${drawInfo.getX()}px`;
                        img.style.top = `${drawInfo.getY()}px`;
                        img.style.width = `${drawInfo.getWidth()}px`;
                        img.style.height = `${drawInfo.getHeight()}px`;
                        if (drawInfo.getMirrored()) {
                            img.classList.add("flipped");
                        }
                        else {
                            img.classList.remove("flipped");
                        }
                    };
                    document.onmouseup = (ev) => {
                        draggedManager?.setDragging(false);
                        draggedManager = null;
                    };
                    document.onmousemove = (ev) => {
                        env.moveMouse(mouseX = ev.clientX, mouseY = ev.clientY);
                    };
                    setInterval(() => {
                        const start = new Date();
                        const width = document.documentElement.clientWidth;
                        const height = document.documentElement.clientHeight;
                        env.setViewport(width, height);
                        env.startTick();
                        manager.tick();
                        env.endTick();
                        const duration = new Date() - start;
                        const imageName = manager.getImageName();
                        if (imageName === "") {
                            img.src = "";
                        }
                        else {
                            let loadedImage = images[imageName];
                            if (loadedImage == null) {
                                loadedImage = new Image();
                                loadedImage.onload = ()=>{
                                    if (manager.getImageName() === imageName) {
                                        drawImage(loadedImage);
                                    }
                                };
                                loadedImage.src = "shime/" + imageName;
                            }
                            else if (loadedImage.complete) {
                                drawImage(loadedImage);
                            }
                        }
                        document.getElementById("output").innerHTML = "Tick finished in " + duration + " ms\n" +
                            `behavior: ${manager.getActiveBehavior()}\n` +
                            `image: ${manager.getImageName()}\n` +
                            `(mouse)  x: ${mouseX}, y: ${mouseY}\n` +
                            `(screen) width: ${width}, height: ${height}\n` +
                            `(anchor) x: ${manager.getX()}, y: ${manager.getY()}`;
                    }, 20);
                }
                catch (err) {
                    document.getElementById("output").innerText = err.toString();
                }
            }
            initShijima();
        </script>
    </body>
</html>
